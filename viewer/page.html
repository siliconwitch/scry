<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scry</title>
<style>
:root {
  --background: #f6f4fa;
  --surface: #ffffff;
  --text: #1f1d24;
  --muted: #6b6578;
  --border: #e4dfee;
  --accent: #7a4fd6;
  --accent-soft: #efe8fc;
}
body { --account: var(--account-light, var(--accent)); }
@media (prefers-color-scheme: dark) {
  :root {
    --background: #16141b;
    --surface: #1f1c26;
    --text: #ece8f4;
    --muted: #9a93a8;
    --border: #2f2a3a;
    --accent: #b493ff;
    --accent-soft: #2c2340;
  }
  body { --account: var(--account-dark, var(--accent)); }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  flex-direction: column;
  background: var(--background);
  color: var(--text);
  font: 14px/1.45 system-ui, sans-serif;
}
header {
  padding: 18px 24px 14px;
  background: var(--account);
  color: var(--surface);
  border-bottom: 1px solid var(--border);
}
h1 {
  margin: 0 0 8px;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
}
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  color: color-mix(in srgb, var(--surface) 80%, transparent);
}
.meta b { color: var(--surface); font-weight: 500; }
.copy { cursor: pointer; }
.copy:hover { text-decoration: underline; }
.attachments {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.attachments:empty { display: none; }
.attachments a, .attachments button, .viewer-bar button, .viewer-bar a {
  padding: 5px 12px;
  border: 1px solid color-mix(in srgb, var(--surface) 40%, transparent);
  border-radius: 6px;
  background: none;
  color: var(--surface);
  font: inherit;
  text-decoration: none;
  cursor: pointer;
}
.attachments a:hover, .attachments button:hover, .viewer-bar button:hover:not(:disabled), .viewer-bar a:hover { border-color: var(--surface); }
.attachments span { color: color-mix(in srgb, var(--surface) 80%, transparent); margin-left: 6px; }
.viewer-bar {
  display: flex;
  align-items: center;
  gap: 8px;
}
.viewer-bar button, .viewer-bar a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
}
.viewer-bar button:disabled { opacity: 0.4; cursor: default; }
.viewer-bar svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.viewer-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
}
.viewer-position { color: color-mix(in srgb, var(--surface) 80%, transparent); }
iframe {
  flex: 1;
  width: 100%;
  border: 0;
  background: #ffffff;
}
.media {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 24px;
}
#image-view, #media-view {
  display: flex;
  align-items: center;
  justify-content: center;
}
#image-view img, #media-view video { max-width: 100%; max-height: 100%; object-fit: contain; }
#office-view {
  flex: 1;
  min-height: 0;
  position: relative;
}
#office-view p { padding: 24px; color: var(--muted); }
#pdf-view {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.pdf-page {
  position: relative;
  flex: none;
  background: #ffffff;
  box-shadow: 0 1px 4px rgb(0 0 0 / 25%);
  cursor: text;
  user-select: none;
}
.pdf-page canvas { display: block; width: 100%; height: 100%; }
.pdf-highlights { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.pdf-highlights div { position: absolute; background: color-mix(in srgb, AccentColor, transparent 60%); }
.pdf-links { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.pdf-links a { position: absolute; pointer-events: auto; cursor: pointer; }
.pdf-links a:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); }
#pdf-view p { color: var(--muted); }
.state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--muted);
}
.state strong {
  font-size: 28px;
  letter-spacing: 6px;
  color: var(--accent);
  font-weight: 300;
}
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 6px 14px;
  border-radius: 6px;
  background: var(--text);
  color: var(--background);
  font-size: 13px;
  box-shadow: 0 2px 8px rgb(0 0 0 / 25%);
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="state" id="state"><strong>scry</strong><span id="state-text">Select an email in scry</span></div>
<header id="header" hidden>
  <h1 id="subject"></h1>
  <div class="meta" id="meta">
    <span>From <b id="from"></b></span>
    <span>To <b id="to"></b></span>
    <span id="cc-row">Cc <b id="cc"></b></span>
    <span id="bcc-row">Bcc <b id="bcc"></b></span>
    <span id="date"></span>
  </div>
  <div class="attachments" id="attachments"></div>
  <div class="viewer-bar" id="viewer-bar" hidden>
    <button id="back" title="Back to the email"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Email</button>
    <span class="viewer-name" id="viewer-name"></span>
    <span class="viewer-position" id="viewer-position"></span>
    <button id="previous" title="Previous attachment"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button id="next" title="Next attachment"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <a id="download" title="Download"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></a>
  </div>
</header>
<iframe id="body" sandbox="" referrerpolicy="no-referrer" hidden></iframe>
<div class="media" id="image-view" hidden><img id="image" alt=""></div>
<div class="media" id="pdf-view" hidden></div>
<div class="media" id="media-view" hidden><video id="media" controls></video></div>
<iframe id="text-view" sandbox="" referrerpolicy="no-referrer" hidden></iframe>
<div id="office-view" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
