# Copy to ~/.config/scry/config.toml.

# Browser command that opens the viewer when scry starts. %s is the viewer's
# address. Leave it out and scry shows the address to open yourself.
viewer = "chromium --app=%s"

# Browser command that opens a link clicked in an email. %s is the link. The
# viewer never opens links itself. Leave it out and links do nothing.
links = "firefox %s"

# Command that shows a notification for each unread email that reaches an
# Inbox while scry runs. Its first, second and third %s are the sender, the
# subject and the start of the email's text. Leave it out and scry shows no
# notifications.
notify = 'notify-send -a scry "%s | %s" "%s"'

# Days to keep sync logs in ~/.local/state/scry/logs.
log-days = 7

# Days of Archive and Sent to keep on this machine. Older mail stays on the
# server and doesn't appear in scry.
history-days = 365
