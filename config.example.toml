# Copy to ~/.config/scry/config.toml.

# Browser command that opens the viewer when scry starts. %s is the viewer's
# address. Leave it out and scry shows the address to open yourself.
viewer = "chromium --app=%s"

# Days to keep sync logs in ~/.local/state/scry/logs.
log-days = 7

# Days of Archive and Sent to keep on this machine. Older mail stays on the
# server and doesn't appear in scry.
history-days = 365
